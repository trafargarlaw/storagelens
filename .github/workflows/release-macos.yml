name: release-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    environment: prod
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure App Store Connect key file
        shell: bash
        run: |
          if [ -z "${{ secrets.APPLE_API_KEY_CONTENT }}" ]; then
            echo "APPLE_API_KEY_CONTENT secret is required for notarization"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "${{ secrets.APPLE_API_KEY_CONTENT }}" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate updater signing secret
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const rawKey = (process.env.RAW_KEY || "").trim();
          const rawPassword = process.env.RAW_PASSWORD || "";

          if (!rawKey) {
            console.error("TAURI_SIGNING_PRIVATE_KEY is empty/unavailable in this job.");
            process.exit(1);
          }
          if (!rawPassword) {
            console.error("TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty/unavailable in this job.");
            process.exit(1);
          }

          let decoded = "";
          try {
            decoded = Buffer.from(rawKey.replace(/[\r\n]/g, ""), "base64").toString("utf8");
          } catch {
            console.error("TAURI_SIGNING_PRIVATE_KEY is not valid base64.");
            process.exit(1);
          }

          const header = decoded.split("\n")[0] || "";
          if (header.includes("public key")) {
            console.error("TAURI_SIGNING_PRIVATE_KEY contains a PUBLIC key. Use ~/.tauri/storagelens.key, not ~/.tauri/storagelens.key.pub");
            process.exit(1);
          }
          if (!header.includes("secret key")) {
            console.error("TAURI_SIGNING_PRIVATE_KEY does not look like a valid updater secret key.");
            process.exit(1);
          }
          NODE

      - name: Build signed + notarized bundle
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: StorageLens ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
