name: release-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    environment: prod
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure App Store Connect key file
        shell: bash
        run: |
          if [ -z "${{ secrets.APPLE_API_KEY_CONTENT }}" ]; then
            echo "APPLE_API_KEY_CONTENT secret is required for notarization"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "${{ secrets.APPLE_API_KEY_CONTENT }}" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare updater signing key
        shell: bash
        run: |
          KEY_FILE="$RUNNER_TEMP/tauri-updater.key"
          RAW_KEY='${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'

          decode_base64() {
            printf '%s' "$1" | tr -d '\r\n' | base64 --decode 2>/dev/null
          }

          CANDIDATE="$RAW_KEY"
          if ! printf '%s' "$CANDIDATE" | grep -q '^untrusted comment:'; then
            if DECODED="$(decode_base64 "$CANDIDATE")"; then
              CANDIDATE="$DECODED"
            fi
          fi
          if ! printf '%s' "$CANDIDATE" | grep -q '^untrusted comment:'; then
            if DECODED2="$(decode_base64 "$CANDIDATE")"; then
              CANDIDATE="$DECODED2"
            fi
          fi

          printf '%s' "$CANDIDATE" > "$KEY_FILE"

          HEADER="$(head -n 1 "$KEY_FILE" || true)"
          if printf '%s' "$HEADER" | grep -q '^untrusted comment: .*secret key'; then
            :
          elif printf '%s' "$HEADER" | grep -q '^untrusted comment: .*public key'; then
            echo "TAURI_SIGNING_PRIVATE_KEY currently contains a PUBLIC key. Use ~/.tauri/storagelens.key, not ~/.tauri/storagelens.key.pub"
            exit 1
          else
            echo "Invalid updater private key format in TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build signed + notarized bundle
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: StorageLens ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
