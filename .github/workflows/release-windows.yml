name: release-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater signing key
        shell: bash
        run: |
          KEY_FILE="$RUNNER_TEMP/tauri-updater.key"
          RAW_KEY='${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'

          if printf '%s' "$RAW_KEY" | grep -q '^untrusted comment:'; then
            printf '%s' "$RAW_KEY" > "$KEY_FILE"
          else
            printf '%s' "$RAW_KEY" | base64 --decode > "$KEY_FILE"
          fi

          if ! head -n 1 "$KEY_FILE" | grep -q '^untrusted comment: .*secret key'; then
            echo "Invalid updater private key format in TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build + publish Windows bundles
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: StorageLens ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
