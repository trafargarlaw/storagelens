[package]
name = "storagelens"
version = "0.2.0"
description = "Desktop disk usage scanner built with Tauri"
authors = ["StorageLens Contributors"]
edition = "2021"

[lib]
name = "storagelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
